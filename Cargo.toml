[package]
name = "tapet"
version = "0.1.0"
edition = "2024"

[dependencies]
eventsource-stream = "0.2.3"
futures-util = "0.3.33"
libc = "0.2.189"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.53", features = ["io-std", "io-util", "macros", "rt-multi-thread", "signal"] }
toml = "0.9"
